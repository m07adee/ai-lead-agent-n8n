<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request a Quote — Mohammad Adeeb</title>
<meta name="description" content="AI automation, AI agents, web & mobile apps. Tell me about your project and get a personalized reply in seconds.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d17; --card:rgba(20,23,40,.72); --line:rgba(255,255,255,.09);
  --text:#eef0ff; --muted:#9aa0c3; --accent:#7c5cff; --accent2:#22d3ee;
  --ok:#34d399; --err:#f87171; --field:rgba(255,255,255,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:32px 16px;overflow-x:hidden}
html[dir=rtl] body{font-family:Cairo,Inter,sans-serif}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.45;z-index:0;pointer-events:none}
.b1{width:420px;height:420px;background:var(--accent);top:-120px;left:-100px}
.b2{width:380px;height:380px;background:var(--accent2);bottom:-140px;right:-80px;opacity:.3}
.wrap{position:relative;z-index:1;width:100%;max-width:620px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-size:18px}
.langs{display:flex;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:4px}
.langs button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;
  padding:6px 12px;border-radius:999px;cursor:pointer;transition:.2s}
.langs button.on{background:var(--accent);color:#fff}
.card{background:var(--card);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;
  padding:34px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--accent2);
  background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.25);padding:5px 11px;border-radius:999px;margin-bottom:14px}
h1{font-size:28px;line-height:1.25;margin-bottom:8px}
.sub{color:var(--muted);font-size:15px;line-height:1.6;margin-bottom:26px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.full{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:#cfd3f5}
label .req{color:var(--accent2)}
input,select,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;
  color:var(--text);font:inherit;font-size:15px;padding:12px 14px;outline:none;transition:.2s}
select{appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
html[dir=rtl] select{background-position:18px 52%,13px 52%}
select option{background:#14172a}
textarea{min-height:120px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(124,92,255,.18)}
input[type=tel]{direction:ltr}
html[dir=rtl] input[type=tel]{text-align:right}
.hp{position:absolute;width:1px;height:1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);opacity:0}
html{overflow-x:hidden}
.btn{margin-top:22px;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-size:16px;font-weight:700;
  color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--accent),#5b8cff 60%,var(--accent2));
  box-shadow:0 12px 30px rgba(124,92,255,.35);transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 16px 36px rgba(124,92,255,.45)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.note{margin-top:14px;text-align:center;font-size:12.5px;color:var(--muted)}
.err{color:var(--err);font-size:13.5px;margin-top:12px;text-align:center;min-height:1em}
/* states */
.state{display:none;text-align:center;padding:10px 0}
.state.show{display:block}
.spinner{width:56px;height:56px;margin:10px auto 22px;border-radius:50%;border:4px solid var(--line);
  border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.steps{list-style:none;display:inline-flex;flex-direction:column;gap:10px;text-align:start;margin-top:8px}
.steps li{color:var(--muted);font-size:14.5px;transition:.3s}
.steps li.on{color:var(--text)}
.steps li.done{color:var(--ok)}
.check{width:64px;height:64px;margin:4px auto 18px;border-radius:50%;display:grid;place-items:center;font-size:30px;
  background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35)}
.reply{margin-top:18px;text-align:start;background:var(--field);border:1px solid var(--line);border-radius:16px;
  padding:20px;white-space:pre-line;line-height:1.7;font-size:15px}
.again{margin-top:18px;background:transparent;border:1px solid var(--line);color:var(--text);border-radius:12px;
  padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:18px}
@media (max-width:560px){.card{padding:24px 18px}.grid{grid-template-columns:1fr}h1{font-size:23px}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<main class="wrap">
  <div class="top">
    <div class="brand"><div class="logo">⚡</div><span>Mohammad Adeeb</span></div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-l="en">EN</button>
      <button type="button" data-l="ar">العربية</button>
      <button type="button" data-l="tr">TR</button>
    </div>
  </div>

  <section class="card">
    <!-- FORM -->
    <form id="f" class="state show" novalidate style="text-align:start">
      <span class="badge" data-t="badge"></span>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="subtitle"></p>
      <div class="grid">
        <div><label for="name"><span data-t="name"></span> <span class="req">*</span></label>
          <input id="name" name="name" required maxlength="80" autocomplete="name"></div>
        <div><label for="email"><span data-t="email"></span> <span class="req">*</span></label>
          <input id="email" name="email" type="email" required maxlength="120" autocomplete="email"></div>
        <div><label for="phone"><span data-t="phone"></span> <span class="req">*</span></label>
          <input id="phone" name="phone" type="tel" required maxlength="25" autocomplete="tel" placeholder="+90 5xx xxx xx xx"></div>
        <div><label for="company" data-t="company"></label>
          <input id="company" name="company" maxlength="100" autocomplete="organization"></div>
        <div class="full"><label for="budget"><span data-t="budget"></span> <span class="req">*</span></label>
          <select id="budget" name="budget" required>
            <option value="" data-t="choose"></option>
            <option value="Under $500" data-t="b1"></option>
            <option value="$500 - $2,000" data-t="b2"></option>
            <option value="$2,000 - $10,000" data-t="b3"></option>
            <option value="$10,000+" data-t="b4"></option>
            <option value="Not sure yet" data-t="b5"></option>
          </select></div>
        <div class="full"><label for="message"><span data-t="message"></span> <span class="req">*</span></label>
          <textarea id="message" name="message" required maxlength="3000" data-tp="msgPh"></textarea></div>
        <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      </div>
      <button class="btn" id="go" type="submit" data-t="send"></button>
      <p class="err" id="err" role="alert"></p>
      <p class="note" data-t="privacy"></p>
    </form>

    <!-- LOADING -->
    <div id="loading" class="state" aria-live="polite">
      <div class="spinner"></div>
      <h1 data-t="working" style="font-size:22px"></h1>
      <ul class="steps"><li data-t="s1"></li><li data-t="s2"></li><li data-t="s3"></li></ul>
    </div>

    <!-- DONE -->
    <div id="done" class="state" aria-live="polite">
      <div class="check">✓</div>
      <h1 id="doneTitle" style="font-size:24px"></h1>
      <p class="sub" data-t="doneSub" style="margin:6px 0 0"></p>
      <div class="reply" id="reply"></div>
      <button class="again" id="again" type="button" data-t="again"></button>
    </div>
  </section>
  <p class="foot" data-t="foot"></p>
</main>

<script>
const T = {
  en:{badge:"⚡ Reply in under a minute",title:"Let's build your next project",
    subtitle:"AI automations, AI agents & chatbots, web and mobile apps. Tell me what you need and get a personalized reply instantly.",
    name:"Full name",email:"Email",phone:"Phone / WhatsApp",company:"Company (optional)",budget:"Budget",choose:"Select a budget…",
    b1:"Under $500",b2:"$500 – $2,000",b3:"$2,000 – $10,000",b4:"$10,000+",b5:"Not sure yet",
    message:"Project details",msgPh:"What do you want to build or automate? Any deadline?",
    send:"Send request →",privacy:"🔒 Your details are only used to reply to your request.",
    working:"Analyzing your request…",s1:"Reading your project details",s2:"Matching it to the right solution",s3:"Writing your personalized reply",
    done:"Thanks, {n}!",doneSub:"Your request was received. Here's my first reply — a copy is on its way to your inbox.",
    again:"Send another request",foot:"© Mohammad Adeeb · AI Automation & Full-Stack Developer",
    eReq:"Please fill in all required fields.",eMail:"Please enter a valid email address.",ePhone:"Please enter a valid phone number.",eNet:"Something went wrong. Please try again in a moment."},
  ar:{badge:"⚡ رد خلال أقل من دقيقة",title:"لنبنِ مشروعك القادم معاً",
    subtitle:"أتمتة بالذكاء الاصطناعي، وكلاء ذكيون وشات بوت، تطبيقات ويب وموبايل. أخبرني بما تحتاجه واحصل على رد مخصص فوراً.",
    name:"الاسم الكامل",email:"البريد الإلكتروني",phone:"الجوال / واتساب",company:"الشركة (اختياري)",budget:"الميزانية",choose:"اختر الميزانية…",
    b1:"أقل من 500$",b2:"500$ – 2,000$",b3:"2,000$ – 10,000$",b4:"أكثر من 10,000$",b5:"غير متأكد بعد",
    message:"تفاصيل المشروع",msgPh:"ماذا تريد أن تبني أو تؤتمت؟ هل هناك موعد نهائي؟",
    send:"أرسل الطلب ←",privacy:"🔒 بياناتك تُستخدم فقط للرد على طلبك.",
    working:"جارٍ تحليل طلبك…",s1:"قراءة تفاصيل مشروعك",s2:"مطابقته مع الحل المناسب",s3:"كتابة رد مخصص لك",
    done:"شكراً {n}!",doneSub:"وصلني طلبك. هذا ردي الأول — وستصلك نسخة على بريدك.",
    again:"إرسال طلب آخر",foot:"© محمد أديب · مطوّر أتمتة بالذكاء الاصطناعي وتطبيقات متكاملة",
    eReq:"يرجى تعبئة جميع الحقول المطلوبة.",eMail:"يرجى إدخال بريد إلكتروني صحيح.",ePhone:"يرجى إدخال رقم جوال صحيح.",eNet:"حدث خطأ، يرجى المحاولة بعد قليل."},
  tr:{badge:"⚡ Bir dakikadan kısa sürede yanıt",title:"Bir sonraki projenizi birlikte yapalım",
    subtitle:"Yapay zekâ otomasyonları, AI ajanları ve chatbotlar, web ve mobil uygulamalar. İhtiyacınızı yazın, anında kişisel yanıt alın.",
    name:"Ad Soyad",email:"E-posta",phone:"Telefon / WhatsApp",company:"Şirket (isteğe bağlı)",budget:"Bütçe",choose:"Bütçe seçin…",
    b1:"500$ altı",b2:"500$ – 2.000$",b3:"2.000$ – 10.000$",b4:"10.000$ üzeri",b5:"Henüz emin değilim",
    message:"Proje detayları",msgPh:"Neyi geliştirmek veya otomatikleştirmek istiyorsunuz? Bir teslim tarihi var mı?",
    send:"Talebi gönder →",privacy:"🔒 Bilgileriniz yalnızca talebinize yanıt vermek için kullanılır.",
    working:"Talebiniz analiz ediliyor…",s1:"Proje detaylarınız okunuyor",s2:"Doğru çözümle eşleştiriliyor",s3:"Size özel yanıt yazılıyor",
    done:"Teşekkürler {n}!",doneSub:"Talebiniz alındı. İşte ilk yanıtım — bir kopyası e-postanıza gönderiliyor.",
    again:"Yeni talep gönder",foot:"© Mohammad Adeeb · AI Otomasyon & Full-Stack Geliştirici",
    eReq:"Lütfen tüm zorunlu alanları doldurun.",eMail:"Lütfen geçerli bir e-posta girin.",ePhone:"Lütfen geçerli bir telefon numarası girin.",eNet:"Bir hata oluştu. Lütfen biraz sonra tekrar deneyin."}
};
const $ = s => document.querySelector(s);
let lang = 'en';
function store(k,v){try{v===undefined?null:localStorage.setItem(k,v);return localStorage.getItem(k)}catch(e){return null}}
function setLang(l){
  lang = T[l] ? l : 'en';
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[lang][e.dataset.t]);
  document.querySelectorAll('[data-tp]').forEach(e=>e.placeholder=T[lang][e.dataset.tp]);
  document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  store('lang',lang);
}
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
const q = new URLSearchParams(location.search).get('lang');
const nav = (navigator.language||'en').slice(0,2);
setLang(q || store('lang') || (T[nav]?nav:'en'));

function show(id){document.querySelectorAll('.state').forEach(s=>s.classList.toggle('show',s.id===id))}
let timers=[];
function animateSteps(){
  const li=[...document.querySelectorAll('.steps li')]; li.forEach(x=>x.className='');
  li[0].className='on';
  timers=[setTimeout(()=>{li[0].className='done';li[1].className='on'},1800),
          setTimeout(()=>{li[1].className='done';li[2].className='on'},3800)];
}

$('#f').addEventListener('submit', async e=>{
  e.preventDefault();
  const f=e.target, d=Object.fromEntries(new FormData(f)), err=$('#err');
  err.textContent='';
  for (const k of ['name','email','phone','budget','message']) d[k]=(d[k]||'').trim();
  if(!d.name||!d.email||!d.phone||!d.budget||!d.message){err.textContent=T[lang].eReq;return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email)){err.textContent=T[lang].eMail;return}
  if(!/^\+?[\d\s\-()]{7,20}$/.test(d.phone)){err.textContent=T[lang].ePhone;return}
  d.lang=lang;
  $('#go').disabled=true; show('loading'); animateSteps();
  try{
    const r=await fetch('/webhook/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
    if(!r.ok) throw new Error(r.status);
    const j=await r.json();
    timers.forEach(clearTimeout);
    $('#doneTitle').textContent=T[lang].done.replace('{n}', j.first_name || d.name.split(' ')[0]);
    $('#reply').textContent=j.reply || '';
    $('#reply').style.display=j.reply?'block':'none';
    show('done');
  }catch(x){
    timers.forEach(clearTimeout); show('f'); err.textContent=T[lang].eNet;
  }finally{$('#go').disabled=false}
});
$('#again').onclick=()=>{$('#f').reset();show('f')};
</script>
</body>
</html>
